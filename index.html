<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>AI Sales Email Copilot</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}input,textarea{width:100%;padding:.5rem;margin:.2rem 0}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>✉️ AI Sales Email Copilot</h1><p>Draft a personalized cold email in seconds.</p><input id="n" placeholder="Prospect name"><input id="c" placeholder="Company"><textarea id="p" rows="2" placeholder="Their pain point (e.g. high OEM maintenance costs)"></textarea><button onclick="go()">Draft email</button><div id="out"></div><script>function go(){const n=document.getElementById('n').value||'there',c=document.getElementById('c').value||'your company',p=document.getElementById('p').value||'rising IT costs';document.getElementById('out').textContent=`Subject A: Cut ${c}'s maintenance costs by 40-60%\nSubject B: Quick idea for ${c}'s IT budget\n\nHi ${n},\n\nI noticed ${p} is a challenge many teams face. Zion Tech Group helps companies like ${c} with multivendor maintenance, AI-powered support and lifecycle services — typically saving 40-60% vs OEM contracts.\n\nHappy to send a short written proposal by email. Worth a look?\n\nBest regards\nZion Tech Group\n\nFull sequence automation & CRM sync: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/ai-sales-email-copilot">GitHub</a> · <a href="https://ziontechgroup.com/zion-ai-sales-intelligence/">Sales Intelligence</a></p></body></html>
